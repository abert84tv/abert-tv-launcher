name: APK derle
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Proje zip olarak yüklendiyse aç
        run: |
          if [ -f proje.zip ]; then unzip -q -o proje.zip -d proje_ac; fi
          G=$(find . -maxdepth 4 -name gradlew -not -path "./.git/*" | head -1)
          echo "SRC=$(dirname "$G")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Gizli imza anahtarı (isteğe bağlı; tanımlı değilse atlanır)
        env:
          KS_B64: ${{ secrets.ABERT_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ABERT_KS_PASS }}
          KS_ALIAS: ${{ secrets.ABERT_KS_ALIAS }}
          KEY_PASS: ${{ secrets.ABERT_KEY_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/abert.jks"
            echo "ABERT_KEYSTORE=$RUNNER_TEMP/abert.jks" >> "$GITHUB_ENV"
            echo "ABERT_KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "ABERT_KS_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "ABERT_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
            echo "Gizli imza anahtarı kullanılıyor"
          else
            echo "Gizli anahtar yok; depodaki sabit anahtar kullanılıyor"
          fi

      - name: Derle
        working-directory: ${{ env.SRC }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK dosyasını hazırla
        run: cp "${{ env.SRC }}/app/build/outputs/apk/debug/app-debug.apk" abert-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: abert-tv-apk
          path: abert-tv.apk

      - name: Releases bölümüne koy (indirme bağlantısı için)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest abert-tv.apk --title "Abert TV (son derleme)" --notes "Otomatik derleme" --target "${{ github.sha }}"
